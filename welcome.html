<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>欢迎 · 四川轻化工大学 开放原子开源协会</title>
<style>
  :root{
    --txt:#111827;
    --dim:#6b7280;
    --line:#e6eaf0;
    --acc:#1478a8;
    --ok:#16a34a;
    --danger:#dc2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0}
  body{
    background:#ffffff; color:var(--txt); overflow:hidden;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    text-align:center;
  }

  /* 背景彩虹光带（静态很淡，开始后才呼吸） */
  .aura{
    position:absolute; inset:-20% -10%; z-index:0; pointer-events:none;
    background:
      radial-gradient(38vw 38vw at 12% 18%, rgba(255,77,77,.16), transparent 62%),
      radial-gradient(40vw 40vw at 88% 22%, rgba(79,125,255,.16), transparent 62%),
      radial-gradient(44vw 44vw at 50% 92%, rgba(62,230,196,.16), transparent 62%);
    opacity:.55; transition:opacity .6s ease;
  }
  body.running .aura{opacity:1; animation:aura 6s ease-in-out infinite}
  @keyframes aura{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06) rotate(1.5deg)}
  }

  .stage > *{position:relative; z-index:1}

  .logo{
    width:clamp(72px,14vmin,116px); height:clamp(72px,14vmin,116px);
    border-radius:50%; object-fit:cover; background:#fff;
    border:1px solid var(--line); box-shadow:0 10px 30px -18px rgba(17,24,39,.5);
    margin-bottom:6px;
  }
  .logo-fb{
    width:clamp(72px,14vmin,116px); height:clamp(72px,14vmin,116px);
    border-radius:50%; display:none; align-items:center; justify-content:center;
    border:1px dashed var(--line); color:var(--acc); font-weight:800; letter-spacing:1px;
    background:#f5fafd; margin-bottom:6px; font-size:clamp(15px,3vmin,22px);
  }

  .uni{
    margin:0; font-size:clamp(15px,2.6vmin,22px); letter-spacing:.32em;
    color:var(--dim); font-weight:600; text-indent:.32em;
  }

  .title{
    margin:6px 0 2px; font-size:clamp(44px,11vmin,120px); line-height:1.08;
    font-weight:900; letter-spacing:.04em;
    max-width:92vw; word-break:break-word;
    background:linear-gradient(92deg,#ff4d4d,#ff9a3c,#ffd93d,#4ade80,#38e1ff,#4f7dff,#b06cff,#ff4d4d);
    background-size:280% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:flow 9s linear infinite;
  }
  @keyframes flow{from{background-position:0% 50%} to{background-position:280% 50%}}

  .sub{
    margin:2px 0 0; font-size:clamp(14px,2.4vmin,20px); color:var(--dim); letter-spacing:.14em;
  }

  .rule{
    width:clamp(120px,26vmin,220px); height:3px; border-radius:99px; margin:18px 0 14px;
    background:linear-gradient(90deg,#ff4d4d,#ffd93d,#4ade80,#38e1ff,#b06cff);
    opacity:.75;
  }

  .ctrl{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center}
  .btn{
    padding:13px 26px; border-radius:999px; border:1px solid var(--acc); background:var(--acc);
    color:#fff; font:inherit; font-size:16px; font-weight:800; letter-spacing:.06em; cursor:pointer;
    box-shadow:0 10px 26px -14px rgba(20,120,168,.9);
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#fff; color:var(--dim); border-color:var(--line); box-shadow:none}
  .btn[disabled]{opacity:.45; cursor:default}

  .ipwrap{display:flex; gap:6px; align-items:center}
  .ip{
    width:150px; padding:10px 12px; border:1px solid var(--line); border-radius:999px;
    font:inherit; font-size:14px; color:var(--txt); text-align:center; outline:none; background:#fff;
  }
  .ip:focus{border-color:var(--acc); box-shadow:0 0 0 3px rgba(20,120,168,.12)}
  .mini{
    padding:10px 16px; border-radius:999px; border:1px solid var(--line); background:#fff;
    font:inherit; font-size:14px; font-weight:700; color:var(--txt); cursor:pointer;
  }

  .status{margin:10px 0 0; font-size:13.5px; color:var(--dim)}
  .status.ok{color:var(--ok)}
  .status.err{color:var(--danger)}

  /* ---------- 改文案 ---------- */
  .fab{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:20;
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:#fff;
    color:var(--dim); font-size:15px; line-height:1; cursor:pointer;
    box-shadow:0 6px 18px -10px rgba(17,24,39,.4);
  }
  .fab:active{color:var(--acc); border-color:var(--acc)}

  .panel{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%, 12px);
    width:calc(100% - 32px); max-width:380px; z-index:30; text-align:left;
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px;
    box-shadow:0 24px 60px -24px rgba(17,24,39,.45);
    display:none; opacity:0; transition:opacity .2s ease, transform .2s ease;
  }
  .pbd{
    position:fixed; inset:0; z-index:25; background:rgba(17,24,39,.22);
    display:none;
  }
  .pbd.open{display:block}
  .title{cursor:pointer}
  .panel.open{display:block; opacity:1; transform:translate(-50%, 0)}
  .panel h4{margin:0 0 10px; font-size:14px; font-weight:800}
  .panel label{display:block; margin-bottom:8px; font-size:12px; color:var(--dim)}
  .panel input{
    width:100%; margin-top:4px; padding:9px 11px; border:1px solid var(--line); border-radius:10px;
    font:inherit; font-size:14px; color:var(--txt); outline:none; background:#fff;
  }
  .panel input:focus{border-color:var(--acc); box-shadow:0 0 0 3px rgba(20,120,168,.12)}
  .panel .row2{display:flex; gap:8px; margin-top:4px}
  .panel .row2 .btn{flex:1; padding:10px; font-size:14px; box-shadow:none}

  @media (max-width:420px){
    .btn{padding:12px 20px; font-size:15px}
    .ip{width:130px}
  }
</style>
</head>
<body>

<div class="aura"></div>

<main class="stage">
  <img class="logo" id="logoImg" src="./oaa.jpg" alt="OAA">
  <div class="logo-fb" id="logoFb">OAA</div>

  <p class="uni" id="tUni">四川轻化工大学</p>
  <h1 class="title" id="tTitle">欢迎新同学</h1>
  <p class="sub" id="tSub">开放原子开源协会 · 招新现场</p>

  <div class="rule"></div>

  <div class="ctrl">
    <button class="btn" id="btnStart">开始迎宾</button>
    <button class="btn ghost" id="btnStop" disabled>停止</button>
    <span class="ipwrap">
      <input class="ip" id="times" type="number" min="0" max="99" value="5"
             style="width:74px" title="摇摆次数，0 = 不限">
      <span style="font-size:12px; color:var(--dim)">次动作</span>
    </span>
  </div>

  <div class="ctrl" style="margin-top:10px">
    <span class="ipwrap">
      <input class="ip" id="ipInput" inputmode="decimal" placeholder="机器狗 IP" autocomplete="off" spellcheck="false">
      <button class="mini" id="btnSet">连接</button>
    </span>
  </div>

  <div class="ctrl" style="margin-top:8px">
    <button class="mini" id="btnEditTop">✎ 改文案</button>
  </div>

  <p class="status" id="status">未连接</p>
</main>

<button class="fab" id="btnEdit" title="改文案">✎</button>

<div class="pbd" id="pbd"></div>

<div class="panel" id="panel">
  <h4>改文案</h4>
  <label>学校 / 第一行
    <input id="fUni" maxlength="24" placeholder="四川轻化工大学">
  </label>
  <label>主标题（大字）
    <input id="fTitle" maxlength="16" placeholder="欢迎新同学">
  </label>
  <label>副标题
    <input id="fSub" maxlength="30" placeholder="开放原子开源协会 · 招新现场">
  </label>
  <label>狗屏文字（上屏用，可写两行）
    <textarea id="fScreen" rows="3" style="width:100%; margin-top:4px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:14px; color:var(--txt); outline:none; resize:vertical; background:#fff"></textarea>
  </label>
  <div class="row2" style="margin:-4px 0 8px">
    <button class="mini" id="btnDefaultScreen" style="flex:1">填入默认三行</button>
  </div>
  <div class="row2">
    <button class="btn" id="btnSaveText">保存</button>
    <button class="btn ghost" id="btnClosePanel">关闭</button>
  </div>
</div>

<script>
'use strict';

var $ = function(id){ return document.getElementById(id); };
var LS = 'dog_console_v4';     // 和主控制台共用同一个配置

var base = '';
var timer = null;
var tick = 0;
var running = false;

/* ---------- 配置读写（合并写，别把主页面存的表情/脚本洗掉） ---------- */
function readStore(){
  try{ return JSON.parse(localStorage.getItem(LS) || '{}') || {}; }catch(e){ return {}; }
}
function writeBase(b){
  var o = readStore();
  o.base = b;
  try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){}
}

function normalize(v){
  var s = String(v || '').trim();
  if(!s) return '';
  if(!/^https?:\/\//i.test(s)) s = 'http://' + s;
  try{ var u = new URL(s); return u.hostname ? u.origin : ''; }catch(e){ return ''; }
}

function setStatus(text, kind){
  var el = $('status');
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

/* ---------- 请求 ---------- */
function hit(path, ms, method){
  if(!base) return Promise.reject(new Error('未连接'));
  var ctrl = new AbortController();
  var timer2 = setTimeout(function(){ ctrl.abort(); }, ms || 5000);
  return fetch(base + path, { method: method || 'GET', cache:'no-store', signal: ctrl.signal })
    .then(function(r){ clearTimeout(timer2); if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .catch(function(e){ clearTimeout(timer2); throw e; });
}

/* =========================================================
 * 上屏：把当前文案渲染成 128×64 黑白 GIF，推到设备屏幕
 * ======================================================= */
var W = 128, H = 64;
var pixels = new Uint8Array(W * H);
var EMO_STEM = 'welcome';

/* 自动挑一个能放下的字号，渲染后二值化到点阵（maxSize 给了就封顶） */
function renderTextToPixels(text, maxSize){
  var txt = String(text || '').trim() || '欢迎';
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var g = c.getContext('2d');
  g.textBaseline = 'top';

  var cap = Math.max(8, Math.min(26, maxSize || 26));
  var sizes = [26, 24, 22, 20, 18, 16, 14, 12, 11, 10, 9, 8].filter(function(s){ return s <= cap; });
  var chosen = null;
  for(var si = 0; si < sizes.length; si++){
    var size = sizes[si];
    g.font = size + 'px "PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif';
    var lh = Math.round(size * 1.12);
    var lines = [];
    String(txt).split('\n').forEach(function(par){
      var cur = '';
      for(var i = 0; i < par.length; i++){
        var test = cur + par[i];
        if(cur && g.measureText(test).width > W - 2){ lines.push(cur); cur = par[i]; }
        else cur = test;
      }
      lines.push(cur);
    });
    lines = lines.filter(function(l){ return l !== ''; });
    if(lines.length * lh <= H && lines.every(function(l){ return g.measureText(l).width <= W - 2; })){
      chosen = { size: size, lines: lines, lh: lh };
      break;
    }
  }
  if(!chosen){ chosen = { size: 10, lines: [String(txt).slice(0, 12)], lh: 12 }; }

  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  g.fillStyle = '#fff';
  g.font = chosen.size + 'px "PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif';
  var y0 = Math.max(0, Math.round((H - chosen.lines.length * chosen.lh) / 2));
  chosen.lines.forEach(function(ln, i){
    var w = g.measureText(ln).width;
    g.fillText(ln, Math.max(1, Math.round((W - w) / 2)), y0 + i * chosen.lh);
  });

  var d = g.getImageData(0, 0, W, H).data;
  for(var k = 0; k < W * H; k++){
    var lum = 0.299 * d[k*4] + 0.587 * d[k*4+1] + 0.114 * d[k*4+2];
    pixels[k] = (d[k*4+3] > 40 && lum > 110) ? 1 : 0;
  }
}

/* 点阵 → 128×64 黑白 GIF89a（每像素前发 Clear，码宽恒 3 bit） */
function gifFromPixels(){
  var bytes = [];
  function push(a){ for(var i = 0; i < a.length; i++) bytes.push(a[i] & 0xff); }
  function push16(v){ bytes.push(v & 0xff, (v >> 8) & 0xff); }
  push([0x47,0x49,0x46,0x38,0x39,0x61]);
  push16(W); push16(H);
  push([0x80, 0x00, 0x00]);
  push([0,0,0, 255,255,255]);
  push([0x21,0xF9,0x04,0x00, 0x00,0x00, 0x00,0x00]);
  push([0x2C]); push16(0); push16(0); push16(W); push16(H); push([0x00]);
  push([0x02]);
  var out = [], cur = 0, bits = 0;
  function emit(code, size){
    cur |= code << bits; bits += size;
    while(bits >= 8){ out.push(cur & 0xff); cur >>= 8; bits -= 8; }
  }
  for(var i = 0; i < W * H; i++){ emit(4, 3); emit(pixels[i] ? 1 : 0, 3); }
  emit(5, 3);
  if(bits > 0) out.push(cur & 0xff);
  for(var off = 0; off < out.length; off += 255){
    var n = Math.min(255, out.length - off);
    bytes.push(n);
    for(var k = 0; k < n; k++) bytes.push(out[off + k]);
  }
  bytes.push(0x00, 0x3B);
  return new Blob([new Uint8Array(bytes)], { type:'image/gif' });
}

function sdPath(p){
  return String(p).split('/').map(function(s){ return s ? encodeURIComponent(s) : ''; }).join('/');
}

function uploadGif(blob, stem){
  return new Promise(function(resolve, reject){
    if(!base){ reject(new Error('未连接')); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('POST', base + '/sdcard/upload');
    xhr.timeout = 60000;
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.setRequestHeader('X-Sd-Path', sdPath('/custom_emo/' + stem + '.gif'));
    xhr.onload = function(){
      var txt = String(xhr.responseText || '').trim();
      if(xhr.status >= 200 && xhr.status < 300 && txt === 'OK') resolve(txt);
      else reject(new Error('上传 HTTP ' + xhr.status + (txt ? ' · ' + txt.slice(0, 40) : '')));
    };
    xhr.onerror = function(){ reject(new Error('上传网络错误')); };
    xhr.ontimeout = function(){ reject(new Error('上传超时')); };
    xhr.send(blob);
  });
}

/* ---------- 连接：发一次站立，200 即成功 ---------- */
function connect(){
  var b = normalize($('ipInput').value);
  if(!b){ setStatus('IP 不对，例如 192.168.1.100', 'err'); return; }
  base = b;
  writeBase(base);
  $('ipInput').value = base.replace(/^https?:\/\//, '');
  setStatus('连接中…');
  hit('/move?dir=stand').then(function(){
    setStatus('已连接 ' + base.replace(/^https?:\/\//, '') + ' · 点「开始迎宾」', 'ok');
  }).catch(function(e){
    setStatus('连不上：' + (e && e.message ? e.message : e), 'err');
  });
}

/* =========================================================
 * 迎宾流程：
 *   开始 → 上屏（一次）
 *        → 每轮：摇摆 + 彩虹灯（brightness=50）；共 N 次（N = 输入框的「次动作」）
 * ======================================================= */
var limit = 5;    // 摇摆次数，0 = 不限
var busy = false;
var lightOk = null, lightErr = '';

/* 灯效只在「灯已经亮着」时才生效：关灯后必须先给一个颜色当底 */
var LIGHT_BASE = '白灯';
var LIGHT_BASE_FALLBACK = '红灯';
var LIGHT_BRI = 50;

function ensureLightOn(){
  return hit('/move?dir=light&dir=light&color=' + encodeURIComponent(LIGHT_BASE) + '&brightness=' + LIGHT_BRI)
    .catch(function(){
      return hit('/move?dir=light&dir=light&color=' + encodeURIComponent(LIGHT_BASE_FALLBACK) + '&brightness=' + LIGHT_BRI);
    });
}

function rainbowOnce(){
  return hit('/move?dir=light_effect&dir=light_effect&effect=rainbow_light&brightness=' + LIGHT_BRI);
}

/* 彩虹灯效：先保底点亮，再上彩虹；失败就重点一次再试 */
function stageLight(){
  return rainbowOnce()
    .catch(function(){
      return ensureLightOn().then(function(){ return rainbowOnce(); });
    })
    .then(function(){ lightOk = true; },
          function(e){ lightOk = false; lightErr = (e && e.message) || '失败'; });
}

function stageSwing(){
  return hit('/move?dir=swing');
}

/* 上屏（只做一次）：渲染文字 → 上传 GIF → reload → 配置 → 播放 */
function setupScene(){
  renderTextToPixels(readText().screen, 12);
  var gif = gifFromPixels();
  return hit('/sdcard/mkdir?path=' + encodeURIComponent('/custom_emo'), 8000, 'POST')
    .catch(function(){})
    .then(function(){ return hit('/custom_emo?cmd=delete&name=' + EMO_STEM).catch(function(){}); })  // 先删旧的，避免读到缓存
    .then(function(){ return uploadGif(gif, EMO_STEM); })
    .then(function(){ return hit('/custom_emo?cmd=reload&name=' + EMO_STEM).catch(function(){}); })
    .then(function(){
      return hit('/custom_emo?cmd=set_config&name=' + EMO_STEM +
        '&music=&action=&custom_action=&loop=1').catch(function(){});
    })
    .then(function(){
      return hit('/custom_emo?cmd=play&name=' + EMO_STEM + '&_=' + Date.now());
    });
}

/* 一次动作：摇摆 + 彩虹灯（同时发，节奏紧凑） */
function nextAction(){
  if(!running) return;
  tick++;
  if(limit && tick > limit){ stop('已完成 ' + limit + ' 次动作（停 + 关灯）'); return; }

  setStatus('动作 ' + tick + (limit ? '/' + limit : '') + ' · 摇摆 + 彩虹灯' +
    (lightOk === false ? '（上次灯失败：' + lightErr + '）' : ''));
  stageSwing().catch(function(){});
  stageLight().catch(function(){});
  timer = setTimeout(nextAction, 1800);
}

function start(){
  if(!base){ $('ipInput').focus(); setStatus('先填 IP 并连接', 'err'); return; }
  if(running) return;
  limit = Math.max(0, Math.min(99, parseInt(($('times').value || '0'), 10) || 0));
  $('times').value = limit;
  running = true;
  busy = false;
  tick = 0;
  lightOk = null;
  lightErr = '';
  document.body.classList.add('running');
  $('btnStart').disabled = true;
  $('btnStop').disabled = false;
  keepAwake();
  setStatus('上屏中…');

  setupScene()
    .then(ensureLightOn)          // 先给个颜色，彩虹才吃得上
    .then(function(){
      if(!running) return;
      var n = readText().screen.split('\n').filter(function(s){ return s.trim() !== ''; }).length;
      setStatus('已上屏（' + n + ' 行）、灯已点亮 · 开始动作' + (limit ? ' × ' + limit : ''));
      nextAction();
    })
    .catch(function(e){
      if(!running) return;
      setStatus('上屏失败（' + (e && e.message ? e.message : e) + '），仍继续动作', 'err');
      nextAction();
    });
}

function stop(msg){
  running = false;
  busy = false;
  document.body.classList.remove('running');
  if(timer){ clearTimeout(timer); timer = null; }
  $('btnStart').disabled = false;
  $('btnStop').disabled = true;
  if(base){
    hit('/custom_emo?cmd=stop&name=' + EMO_STEM).catch(function(){});
    hit('/emotion?emotion=neutral').catch(function(){});
    hit('/move?dir=stop').catch(function(){});
    hit('/move?dir=light&dir=light&color=' + encodeURIComponent('关灯') + '&brightness=0').catch(function(){});
    setStatus(msg || '已停止（动作停、灯关）');
    // 兜底：万一闪灯/动作还有一步在路上，稍后再关一次灯
    setTimeout(function(){
      hit('/move?dir=light&dir=light&color=' + encodeURIComponent('关灯') + '&brightness=0').catch(function(){});
    }, 600);
  }else{
    setStatus(msg || '已停止');
  }
}

/* 展示页别自动息屏 */
function keepAwake(){
  try{
    if(navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request('screen').catch(function(){});
    }
  }catch(e){}
}

/* ---------- 文案：可改、可存 ---------- */
var TEXT_KEY = 'welcome_text_v1';
var OLD_SCREEN = '欢迎XXX同学\nSUSE开放原子开源协会';
var DEFAULT_TEXT = {
  uni: '四川轻化工大学',
  title: '欢迎新同学',
  sub: '开放原子开源协会 · 招新现场',
  screen: '四川轻化工大学\n欢迎XXX同学\nSUSE开放原子开源协会'
};

function readText(){
  var o = {};
  try{ o = JSON.parse(localStorage.getItem(TEXT_KEY) || '{}') || {}; }catch(e){ o = {}; }
  var screen = (typeof o.screen === 'string' && o.screen) ? o.screen : DEFAULT_TEXT.screen;

  // 老的两行默认值 → 三行
  if(screen === OLD_SCREEN) screen = DEFAULT_TEXT.screen;

  // 老的两行自定义（以「欢迎」开头、没有「四川」）→ 顶上补一行学校名，并落盘，免得每次重复补
  var lines = screen.split('\n');
  if(screen.indexOf('四川') < 0 && /^\s*欢迎/.test(lines[0] || '') && lines.length <= 2){
    screen = '四川轻化工大学\n' + screen;
    try{
      o.screen = screen;
      localStorage.setItem(TEXT_KEY, JSON.stringify(o));
    }catch(e){}
  }

  return {
    uni: (typeof o.uni === 'string' && o.uni) ? o.uni : DEFAULT_TEXT.uni,
    title: (typeof o.title === 'string' && o.title) ? o.title : DEFAULT_TEXT.title,
    sub: (typeof o.sub === 'string') ? o.sub : DEFAULT_TEXT.sub,
    screen: screen
  };
}

function applyText(t){
  $('tUni').textContent = t.uni;
  $('tTitle').textContent = t.title;
  $('tSub').textContent = t.sub;
  document.title = t.title + ' · ' + t.uni;
}

function openPanel(){
  var t = readText();
  $('fUni').value = t.uni;
  $('fTitle').value = t.title;
  $('fSub').value = t.sub;
  $('fScreen').value = t.screen;
  $('pbd').classList.add('open');
  $('panel').classList.add('open');
  setTimeout(function(){ $('fTitle').focus(); }, 120);
}

function closePanel(){
  $('pbd').classList.remove('open');
  $('panel').classList.remove('open');
}

function saveText(){
  var t = {
    uni: ($('fUni').value || '').trim() || DEFAULT_TEXT.uni,
    title: ($('fTitle').value || '').trim() || DEFAULT_TEXT.title,
    sub: ($('fSub').value || '').trim(),
    screen: ($('fScreen').value || '').trim() || DEFAULT_TEXT.screen
  };
  try{ localStorage.setItem(TEXT_KEY, JSON.stringify(t)); }catch(e){}
  applyText(t);
  closePanel();
  setStatus('已保存（狗屏文字下次上屏生效）', 'ok');
}

/* ---------- 启动 ---------- */
(function init(){
  var logo = $('logoImg');
  function logoFail(){ logo.style.display = 'none'; $('logoFb').style.display = 'flex'; }
  logo.addEventListener('error', logoFail);
  if(logo.complete && logo.naturalWidth === 0) logoFail();

  applyText(readText());
  $('btnEdit').addEventListener('click', openPanel);
  $('btnEditTop').addEventListener('click', openPanel);
  $('tTitle').addEventListener('click', openPanel);
  $('pbd').addEventListener('click', closePanel);
  $('btnSaveText').addEventListener('click', saveText);
  $('btnClosePanel').addEventListener('click', closePanel);
  $('btnDefaultScreen').addEventListener('click', function(){
    $('fScreen').value = DEFAULT_TEXT.screen;
    setStatus('已填入默认三行，点「保存」生效');
  });
  $('panel').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && (!e.target || e.target.tagName !== 'TEXTAREA')){
      e.preventDefault(); saveText();
    }
  });

  var saved = readStore().base || '';
  if(saved){
    base = normalize(saved);
    $('ipInput').value = base.replace(/^https?:\/\//, '');
    setStatus('上次的设备：' + base.replace(/^https?:\/\//, '') + '（点「连接」握手）');
  }

  $('btnSet').addEventListener('click', connect);
  $('ipInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') connect(); });
  $('btnStart').addEventListener('click', start);
  $('btnStop').addEventListener('click', function(){ stop(); });

  window.addEventListener('beforeunload', function(){ if(running) stop(); });
})();
</script>
</body>
</html>
